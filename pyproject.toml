[project]
name = "impronta"
version = "0.1.0"
description = "Speaker identification for ElevenLabs Scribe v2 transcripts: enroll voices, identify diarized speakers, map speaker_ids to real names"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.10"
authors = [{ name = "Tarik Hastor" }]
keywords = ["speaker-identification", "speaker-recognition", "diarization", "elevenlabs", "scribe", "ecapa-tdnn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
    "faiss-cpu>=1.8",
    "torch>=2.1",
    "speechbrain>=1.0",
]

[project.optional-dependencies]
m4a = ["av>=12"]

[dependency-groups]
demo = ["gradio>=5", "requests>=2.31"]
tuning = ["optuna>=3.6", "pandas>=2.0", "matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "av>=12",  # m4a decode for the prodaudio tier
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impronta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not live and not prodaudio' --disable-socket --strict-markers"
markers = [
    "integration: requires torch + ECAPA model download (run with -m integration)",
    "live: requires ELEVENLABS_API_KEY and network (run with -m live)",
    "prodaudio: requires real recordings in $IMPRONTA_PROD_AUDIO_DIR + torch (run with -m prodaudio)",
]

[tool.coverage.run]
source = ["src/impronta"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
